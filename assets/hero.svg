  <g font-family="Segoe UI, Inter, Arial, sans-serif" fill="#f8fafc">
    <text x="370" y="135" font-size="62" font-weight="800" letter-spacing="-2">Codex Model Router</text>
    <text x="374" y="188" font-size="25" fill="#cbd5e1">THE LOCAL TOKEN SAVER FOR CODEX DESKTOP</text>
    <g transform="translate(374 229)" font-size="18" font-weight="700"><rect width="132" height="48" rx="24" fill="#083344" stroke="#22d3ee"/><text x="66" y="31" text-anchor="middle" fill="#67e8f9">LUNA</text><rect x="146" width="132" height="48" rx="24" fill="#052e16" stroke="#4ade80"/><text x="212" y="31" text-anchor="middle" fill="#86efac">TERRA</text><rect x="292" width="132" height="48" rx="24" fill="#172554" stroke="#60a5fa"/><text x="358" y="31" text-anchor="middle" fill="#93c5fd">SOL</text><rect x="438" width="146" height="48" rx="24" fill="#3b0764" stroke="#c084fc"/><text x="511" y="31" text-anchor="middle" fill="#d8b4fe">ASTRA</text></g>
    <text x="374" y="329" font-size="28" font-weight="600" fill="#e2e8f0">Save tokens automatically. Keep the native GUI.</text>
